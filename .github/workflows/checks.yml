name: checks

# `pull_request` rather than `push` on branches: the event checks out GitHub's
# merge ref, so what runs is the branch *merged with* the base. That is the
# combination a branch's own tests never see, and the one that broke `main`
# when two PRs each passed alone and failed together.
on:
  pull_request:
  push:
    branches: [main]

# A second push to a PR makes the first run irrelevant; let it go rather than
# paying for an answer about a commit nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # macOS because the shell confinement is `sandbox-exec`, which exists
    # nowhere else. On Linux those tests skip themselves and the boundary they
    # cover -- the one keeping `execute` off the host -- would go unchecked by
    # CI entirely, which is the half most worth checking.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A uv-managed interpreter, pinned rather than inherited. The runner
      # ships a *framework* Python, and under it the shell confinement refuses
      # to start `python3` at all -- `realpath: .../.venv/bin/: Operation not
      # permitted` -- while a uv-managed one is fine. That is a real gap and it
      # has an issue; it is not what this workflow is for, and testing against
      # an interpreter no contributor has would make every run about the
      # runner. `uv python install` is what everyone here already develops on.
      - name: Pin a uv-managed Python
        run: uv python install 3.12

      - name: Install the project
        run: uv sync --all-extras --dev

      # Three separate steps rather than one `&&` chain, so a red build says
      # which of the three failed from the job list without opening the log.
      - name: ruff
        run: uv run ruff check src/ tests/ assets_examples/ evals/

      - name: ty
        run: uv run ty check

      - name: pytest
        run: uv run pytest -q

  # The other half of the sentence at the top of `checks`. The fences that keep
  # `execute` off the host are `sandbox-exec` on macOS and Landlock or
  # bubblewrap on Linux, and each exists on exactly one platform -- so the job
  # above covers one of the two and skips the other, in a repository that
  # deploys to Linux. `tests/linux/` held real escape tests that had never run
  # anywhere.
  #
  # The same three steps, so a Linux-only regression is caught the same way and
  # not only by `pytest`: `--all-extras` is what installs `sandlock`, which is
  # `sys_platform == 'linux'` and therefore absent from the macOS job's install
  # however many extras it asks for.
  fences:
    name: the Linux fence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Pin a uv-managed Python
        run: uv python install 3.12

      # bwrap is not on the image, and installing it is not sufficient to run
      # its half. This job was written expecting bubblewrap to be the half a
      # bare runner could exercise, on the grounds that `ubuntu-latest` had
      # been below the ABI a full Landlock ruleset needs. The first green run
      # said the opposite: the image is on Landlock ABI 7 against the 6
      # required, so the Landlock escapes run, while bwrap installs and is
      # still unavailable because the image refuses an unprivileged user
      # namespace and the probe cannot make one.
      #
      # Installed anyway, for two reasons that survive being wrong about which
      # half runs: the `fence coverage:` line then distinguishes "no binary"
      # from "namespace refused", which are the same word otherwise; and the
      # bubblewrap escapes begin running the day that policy relaxes, without
      # this file having to be edited again to notice. Relaxing it here instead
      # is one sysctl away and deliberately not done yet -- that is a decision
      # about how much the runner is allowed to weaken, not a comment.
      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: ruff
        run: uv run ruff check src/ tests/ assets_examples/ evals/

      - name: ty
        run: uv run ty check

      # `-rs` so the log says which fence skipped and why. A green job here
      # with everything skipped is what `tests/linux/test_a_fence_was_exercised.py`
      # exists to turn red.
      - name: pytest
        run: uv run pytest -q -rs

  # The jobs above install every extra and the dev group, so a public name that
  # resolves only because one of those happens to be present looks fine there.
  # This runs the install instead, which is the only way to notice a package that
  # arrived through somebody else's dependencies.
  #
  # Deliberately not `--all-extras`, deliberately not `--dev`: a plain install,
  # the way anyone who runs `pip install kingfisher` gets one.
  base-install:
    name: the library alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Pin a uv-managed Python
        run: uv python install 3.12

      # Built and installed as a wheel, into a venv outside the workspace, and
      # driven through that venv's own binaries. Every shortcut here was tried
      # and defeats the job: `uv run` re-syncs the workspace before running, so
      # it installs the very packages this is checking are absent.
      - name: Build and install only the library
        run: |
          uv build --wheel --out-dir /tmp/wheels .
          uv venv /tmp/alone
          VIRTUAL_ENV=/tmp/alone uv pip install /tmp/wheels/kingfisher-*.whl

      # Every public name, not just an import of the package: the package
      # imports lazily, so `import kingfisher` succeeding proves nothing about
      # whether the names behind it can be reached.
      - name: Every public name resolves
        run: |
          /tmp/alone/bin/python -c "
          import kingfisher
          for name in kingfisher._EXPORTS:
              getattr(kingfisher, name)
          print(f'{len(kingfisher._EXPORTS)} public names, from a plain install')
          for absent in ('kingfisher_assets',):
              try:
                  __import__(absent)
              except ModuleNotFoundError:
                  continue
              raise SystemExit(f'{absent} is installed and should not be')
          "
