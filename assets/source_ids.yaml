# The source-id vocabulary: which names exist here.
#
# Copy this to `$KINGFISHER_DEFINITIONS_DIR/source_ids.yaml`, beside the
# definitions it governs. `seed` does not copy it: `seed` copies definitions,
# and this is not one. A deployment writing it is deciding something about itself.
#
# **With no such file, kingfisher controls nothing by source id.** Every
# definition is reachable by everyone and a `source_ids:` line anywhere is inert.
#
# **This file holds no policy.** Who reaches what is written in the definitions
# themselves -- see `agents/analyst.yaml` and `subagents/auditor.yaml` beside
# it. What lives here is that a name is *real*, so `source_ids: [sales_bd]` is
# refused at startup rather than inventing a source id nobody holds.
#
# Each name stands only for itself. A role that should reach what several names
# reach is the caller's to spell out: send `sales_db` and `audit_log`, not a name
# meaning both. A definition that needs two held at once writes them as a set in
# its own line, `source_ids: [{sales_db, pii}]`.
source_ids:
  - sales_db
  - audit_log
  # A classification, held alongside a source above rather than instead of one.
  - pii

# The datazones a caller may be in, and a subagent or tool may require. A caller
# is in one at most -- `datazone="emea"` beside `source_ids=` -- and reaches what
# names that one or none. `subagents/quarters.py` is the one that names `emea`.
datazones: [emea, apac]

# There is no `agents:`, `subagents:` or `tools:` section here, and writing one
# is refused by name: audiences live in the definitions, which cannot name an
# asset the workspace no longer offers.
