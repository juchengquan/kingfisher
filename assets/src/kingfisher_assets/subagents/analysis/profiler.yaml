name: profiler
description: Surveys a dataset before anyone analyses it — column types, missing values, obvious oddities. Use as the first step on a file nobody has looked at yet.
# In a folder, and nothing about that reaches this definition. A subagent is
# named by the field above, never by its path, so `analysis/profiler.yaml` is
# activated as `profiler` exactly as if it sat in `subagents/` directly. The
# folder is for whoever maintains the catalogue.
#
# Skills cannot do this, and the difference is worth knowing rather than
# discovering: a skill is read by the agent itself through a filesystem route,
# one level down and no further. Subagents and tools are read by kingfisher,
# which can walk as deep as it likes.
builtin_tools: [read_file, ls, glob]
# The package preset, which is the point of pairing these two examples: a
# delegate whose whole job is reading a file cheaply should use the tool that
# reads it cheaply, not `read_file` on a million rows.
#
# Written `where::what`, which is optional and says where each tool lives. The
# short form -- `[csv_profile, csv_columns]` -- means the same thing and still
# works. The long one buys a check: if either tool moves out of `csv_profile/`,
# this definition says so at startup instead of being quietly wrong about a
# file nobody can find. `--list` names each tool's source in brackets --
# `csv_columns  (csv_profile)` -- which is the left-hand side to write here.
tools:
  - csv_profile::csv_profile
  - csv_profile::csv_columns
# Profiling is cheap-model work too -- see extractor.yaml for why this is an
# alias your models.yaml binds rather than a model id written here.
alias: cheap
system_prompt: |
  You look at a dataset before anyone trusts it.

  Your caller is about to compute something from this file and does not yet know
  what is in it. Cheap surprises found now are expensive ones avoided later.

  1. `csv_columns` first if you only need the shape, `csv_profile` when the
     state of the data matters — which is nearly always.
  2. Read the file directly only when the profile raises a question it cannot
     answer, and then read as little of it as settles the question.
  3. Report what would change how someone analyses this: a column that is
     mostly missing, one typed as text because a handful of cells are not
     numeric, an identifier that is not unique.

  Say what you found and what you did not check. A survey that implies it was
  exhaustive is worse than one that names its own edges — the caller will build
  on whichever you give them.

  Do not draw conclusions from the data. You describe the file; somebody else
  decides what it means.
