name: analyst
description: Answers questions from the data, with the database behind a source id.
# Who may open a session on this agent. Everything below narrows from here, and
# nothing can widen past it.
#
# This line is the whole of what most definitions need. `assistant.yaml` and
# `operator.yaml` beside this one carry none, which means they are reachable by
# everyone -- and that is what an absent optional field means everywhere else
# in these formats. Adopting source-id access is annotating the definitions
# that matter and leaving the rest alone; `kingfisher list` names the ones
# carrying no line, so default-open is not also silent.
#
# The names have to be declared in `source_ids.yaml`. A typo here is refused at
# startup rather than inventing a source id nobody holds -- which would leave
# this agent quietly reachable by no one, found weeks later by whoever needed
# it.
source_ids: [sales_db, audit_log]
# `task` is how it reaches `auditor` below. Naming a subagent does not grant the
# tool that calls one, and a list without it is refused at load.
builtin_tools: [read_file, ls, glob, grep, task]
# Names, and nothing beside them: who may use a tool is said once, in the tool's
# own file. `tools/sql_query.py` declares `ToolSpec(sql_query, source_ids=["sales_db"])`,
# so a caller holding only `audit_log` opens this agent and runs it without the
# database, and so does every other agent granting it. An entry here saying who
# it is for is refused at load. What this agent decides is which tools it lists.
tools:
  - sql_query
  - csv_profile::csv_profile
  - line_count
# No `builtin_tools` audience, and there cannot be one: deepagents registers its
# own tools, so kingfisher can filter them but never leave them out of a graph.
# What gates them is the line at the top of this file -- an agent declaring a
# read-only builtin set cannot hand anyone the shell, whoever they are.
#
# **A `skills:` entry is the one entry that may say who it is for**, because a
# skill's own file is `SKILL.md`, which the model reads whole and a deployment may
# not own. Written long, `{name, source_ids}`, beside the plain names; a bare name
# inherits the line at the top.
skills:
  # Narrower than this definition, and an **and** with it: a caller holding only
  # `audit_log` opens this agent and is never told the profiling procedure
  # exists; one holding `sales_db` is.
  #
  # Worth being exact about what that does and does not buy. Removing a skill
  # means the agent is not *told* about it -- the file is still on disk, and a
  # skill was never a boundary. The boundary is the tools the procedure would
  # need, which carry locks of their own, in their own files.
  - name: tabular-qa
    source_ids: [sales_db]
  - code-review
# Names only, as under `tools:`. A subagent says who reaches it in its own file,
# and that holds wherever it is used: `subagents/auditor.yaml` is for two
# source ids, and `subagents/quarters.py` for `sales_db` callers in the `emea`
# datazone.
subagents:
  - auditor
  - quarters
memory: false
system_prompt: |
  You answer questions about the data in this workspace.

  Check what you have before planning around it. If `sql_query` is not among
  your tools, this caller may not reach the database through you, and the
  answer is to work from the files or to say what you cannot check -- not to
  ask for the tool, which will not arrive.

  That is the ordinary case rather than a failure. Two people run this agent
  and one of them is holding fewer tools than the other; the report should be
  honest about which of the two produced it.

  Profile a file with `csv_profile` before computing anything from it, and read
  the file itself only when the profile raises a question it cannot answer. A
  column that is mostly missing, or typed as text because a handful of cells are
  not numbers, is cheap to find now and expensive to find in a published figure.

  Say what you computed and from where. A figure whose source is not named is
  a figure somebody has to reproduce before they can use it.
