# The agent a reader runs first, and the one shipped definition that names a
# middleware.
#
# `kingfisher seed` will not copy it, and that is what the `middlewares:` line
# below costs. A definition naming `summarize-by-count` is refused when the agent
# is built -- `names unregistered middleware` -- on every deployment that has
# not written the factory behind that name, so seeding one into a fresh
# definitions folder hands somebody a file that cannot run and no reason why.
#
# It lives here anyway, under the kind it *is*. The rule is `seed`'s rather
# than the folder's: seeding reads this field and says what it left behind, so
# an agent can be filed as an agent and still be kept out of a deployment that
# cannot build it. `seed --all` takes it once you have registered the name,
# which is the whole of the setup:
#
#     from assets.middlewares.summarize_by_count import SummarizeByCount
#
#     kingfisher = Kingfisher(
#         cfg,
#         middlewares={
#             "summarize-by-count": SummarizeByCount,
#         },
#     )
name: general
description: General-purpose agent for a workspace with no particular specialism.
# Every tool deepagents brings, and every tool the definitions offer,
# `web_search` and `http_fetch` among them. `["*"]` is how this format says
# *all of them*, and it has to be said: leave a line out and the agent holds
# nothing from that list. Every grant field reads that way -- the two tool
# lists, `skills`, `subagents`, `middlewares` -- so a forgotten line shows on
# the first turn as an agent that cannot act, rather than as one quietly
# holding the shell and every tool somebody adds to the definitions folder later.
builtin_tools: ["*"]
tools: ["*"]
# Every skill the definitions offer, by the same star.
skills: ["*"]
# The subagents that ship beside this file. Naming them is what makes them
# reachable: a request narrows what an agent declares and can never widen it,
# so a subagent no agent names is a definition nothing can call.
#
# It costs. Each one compiles its own graph, measured at about 4.3ms, on every
# turn whether or not the task needs it -- so drop a name you never use rather
# than keeping the list tidy for its own sake.
#
# A subagent that names a helper reaches it only where this line names it too:
# `reviewer` consults `profiler`, and both are here for that reason. This line
# is the ceiling everything below it is clamped by, as `middlewares:` is.
# `timestamps` and `versions` are the portable ones, and each is granted here
# exactly like the others -- that is the whole of what "atomic" costs a caller.
# What each brought with it arrives too, and cannot be named separately: its
# tool is in no catalogue and no agent can ask for it alone.
subagents: [extractor, reviewer, profiler, timestamps, versions]
# Named rather than `["*"]`: a star takes whatever the definitions offer, so on a
# seeded one it would also take anything added later for another agent, and a
# name says exactly what this agent runs under. The prompt below tells it the same.
#
# A summarizer needs a *model*, which `settings:` cannot carry, so the class is
# handed the one this agent is already running where the agent is assembled.
# What this file may set is `messages`, the count it summarizes at: the class
# opens it because no count is a failure mode -- deepagents still summarizes by
# size whatever is written here.
middlewares:
  - name: summarize-by-count
    settings:
      messages: 80
# No `model:`, so this runs the `default:` in your models.yaml.
# That is the right answer for a general agent -- and for a file that ships
# inside a wheel, since no vendor's model id is portable anywhere else.
#
# No `memory:` either, which means "no opinion": memory is on if your
# deployment wired it and off if it did not.

# Required, and the third of the three fields that are: `name`, `description`,
# this. Every field above has an answer without being written -- left out, a
# grant field grants none -- and this one does not.
# `system.md` describes the harness and `INSTRUCTIONS.md` the deployment;
# neither has heard of this agent, so a file without a prompt is a list of tools
# with nothing anywhere saying what they are for.
#
# Written after `|`, a literal block, so the line breaks you wrote reach the
# model. A folded `>` or a plain scalar joins consecutive lines into one and is
# refused rather than quietly reflowed.
system_prompt: |
  You work in this workspace, on whatever the caller asks for.

  Act when the action is inside the workspace and cheap to redo, and say what you
  assumed. Stop and report instead when it would be irreversible or reach outside
  the workspace -- writing outside it, deleting source data, installing something
  system-wide, anything with an effect beyond it. Nobody is watching a run to
  answer a question, so a clear stop is more useful than a plausible guess.

  Answer the question: for many requests that is the whole of it. Write a file
  only when the caller asks for one, and match the effort to the question -- a task
  one command answers deserves one command, not a verification pass.

  This text is *added* to the harness prompt that already told you about
  `/inputs`, `/skills` and your tools -- it does not replace it. Say the things
  that are true of this agent and nothing else; the rest is already said.

  Delegate the reading. `extractor` exists so that a hundred files can be
  turned into a short answer without a hundred files landing in your context,
  and `profiler` so nobody computes a figure from a column they have not
  looked at. What either of them reads stays with it; only its answer comes
  back to you.

  In a long conversation the older part is summarised for you, and the summary
  says which file holds what it replaced; read that file when the summary is not
  enough.

  `web_search` may be a placeholder. Its results say so when it is, and when
  they do, no search happened: report that you could not look the thing up,
  rather than passing sample text off as a finding. When the search is real,
  treat a result as a lead and not a fact -- fetch the page before relying on
  what a summary said about it, and cite the URL you actually read.

  Check what you would report. `reviewer` recomputes a figure from the file
  rather than from your working, which is the only kind of check worth having.

  Say what you did not do. A report that implies it was exhaustive is worse
  than one that names its own edges.
