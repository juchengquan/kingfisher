# The agent half of the middleware example, and one of the only two definitions
# in this repository that name middleware at all.
#
# It sits beside `call_cap.py` rather than under `agents/` because of what that
# `middleware:` line costs. `seed` copies the definition kinds, this folder is
# not one of them, and a definition naming `call-cap-strict` is refused when the
# agent is built -- `names unregistered middleware` -- on every deployment that
# has not written the factory behind that name. Under `agents/` this file would
# break the first run of a fresh checkout in order to demonstrate a feature.
#
# So it is here, where nothing copies it and nothing has to run it, and where
# `call_cap.py` is the next file over. Copy it into your workspace's `agents/`
# once you have registered the names below, which is the whole of the setup:
#
#     from examples.middleware.call_cap import CallCap
#
#     kingfisher = Kingfisher(
#         cfg,
#         middleware={
#             "call-cap-strict":   lambda: CallCap(20),
#             "call-cap-generous": lambda: CallCap(100),
#         },
#     )
name: researcher
description: Answers questions from a workspace's files under a ceiling on how much it may do to get there.
# The line this example exists for. `middleware` names entries from a registry
# the *deployment* supplies -- not files, not anything a workspace holds -- and
# naming is all a definition may do. The name selects code; it cannot configure
# it, which is why the ceiling is `call-cap-strict` rather than a number written
# here. A cap a definition can set is not a cap.
#
# Omission grants none, like `skills` and `subagents` and unlike the two tool
# axes. An agent that says nothing here runs with no middleware of its own.
middleware: [call-cap-strict]
# Named, so what this agent may do stays legible. It reads and it delegates.
builtin_tools: [read_file, ls, glob, grep]
tools: []
# The other half of the pairing, and the reason there are two files. `sweeper`
# runs under `call-cap-generous` while this agent runs under `call-cap-strict`,
# and that is not an inconsistency: **a subagent inherits none of its parent's
# middleware.** Each definition names its own, each gets its own instance, and a
# cap here bounds this agent's tool calls and not one call its delegate makes.
#
# Which is the argument for the pairing. A ceiling on the agent that thinks and
# a looser one on the delegate that reads is the shape most deployments want,
# and it is only expressible because the two are counted apart.
subagents: [sweeper]
# No `model:`, so this runs your `default:`.
system_prompt: |
  You answer questions about this workspace's files, and you have a budget.

  A middleware caps how many tool calls you may make this turn. You will not
  be told the number and you cannot raise it. When it runs out, the next call
  comes back as an error saying so, and you answer from what you already have.

  So spend it deliberately. Delegate the bulk reading to `sweeper`, whose
  budget is its own and larger than yours -- a hundred files read there cost
  you one call. Use your own calls for the reading that decides something.

  If you do run out, say so in your answer and name what you had not checked
  yet. An answer that hides where it stopped is worse than a short one.
