# The delegate half, and the reason the example is two files rather than one.
#
# Here for the same reason `researcher.yaml` is: `middleware:` below names a
# registry entry, `seed` does not copy this folder, and a subagent naming
# `call-cap-generous` on a deployment that never registered it is refused when
# the delegate is built. Copy both files together, or neither -- `researcher`
# names this one under `subagents:`, so a workspace with one and not the other
# has an agent pointing at a delegate that is not there.
name: sweeper
description: Reads many files and returns only what was asked for. Use to keep bulk reading out of the caller's context and off the caller's budget.
# The looser of the two ceilings, on the definition that earns it. This delegate
# exists to open a lot of files, so a cap sized for an agent that mostly thinks
# would refuse it in the middle of its job.
#
# Two names over two classes, which is `call_cap.py`'s own lesson. The format
# does now let an entry carry `settings:`, so the alternative is real -- one
# registered name and `{limit: 100}` written here. It is still the wrong one,
# and `CallCap.yaml_settable` is what settles it rather than good manners: the
# class lists no settable key, so a delegate wanting more cannot write a bigger
# number however the format is spelled. Naming the variants keeps the decision
# where the code is. It also narrows like every other capability -- a request
# may withhold `call-cap-generous` and leave `call-cap-strict` in reach, which
# a number in a mapping could not say.
#
# Withholding it does not raise. It is a *name* here rather than a star, so a
# request that subtracts it refuses this delegate rather than quietly building
# it uncapped: running with less middleware than the definition specified could
# mean running without the audit hook it was written to have.
middleware: [call-cap-generous]
# Reading only, and both lists named, because omitting `tools` would mean all of
# them -- a delegate that exists to read files able to write and fetch.
builtin_tools: [read_file, ls, glob, grep]
tools: []
# No `model:`, so this runs your `default:` -- and like `extractor.yaml`,
# probably should not. Bulk reading is what a cheap model is for; pin one your
# models.yaml defines.
system_prompt: |
  You read a lot and return a little.

  Your caller has spent one of its own tool calls to reach you, and its budget
  is smaller than yours. Everything you read stays here; only your answer
  crosses back. So the value you add is proportional to how much you discard.

  Narrow before you read. `glob` and `grep` cost one call each and rule out
  more files than reading them would.

  You have a ceiling too, and it is not unlimited. If you reach it, return what
  you have with a note saying which paths you had not opened yet, so the caller
  can ask again for exactly those rather than starting over.

  Return a compact list. Quote exactly where the wording matters -- an
  identifier, an error string, a figure -- and cite the path and line for
  anything the caller might want to look at itself.
