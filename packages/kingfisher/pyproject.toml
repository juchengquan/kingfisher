[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kingfisher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name="juchengquan"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "deepagents>=0.7.6",
    # Imported directly by infrastructure/harness/agent.py, lazily, so that installing it
    # costs nothing until `KINGFISHER_INTERPRETER` is on. It also arrives through
    # deepagents' own `quickjs` extra, but an extra is not a promise either -- if
    # upstream renames it, uv warns and moves on while our import breaks. The
    # floor is deepagents' (`>=0.3.3` at 0.7.6) rather than the one the docs page
    # advertises, which is two minors behind what the library actually needs.
    # Verified rather than copied: the interpreter tests pass against 0.3.3 in a
    # venv pinned to it.
    #
    # Ceilinged because it is beta and says so at every construction. Under 0.x
    # the minor is where breaks land, and this one has moved through 0.1, 0.2 and
    # 0.3 in under two months -- deepagents raising its own floor to 0.3.3 is that
    # churn showing. `<0.4` takes the patches and stops at the next minor.
    #
    # If deepagents later needs `>=0.4`, uv fails to resolve rather than
    # installing something untested. That is the intended outcome: a build that
    # stops is a decision to make, where a silent upgrade is one already made.
    "langchain-quickjs>=0.3.3,<0.4",
    # Imported directly by infrastructure/harness/models.py. It also arrives
    # transitively through deepagents, but a transitive dep is not a promise.
    "langchain-anthropic>=1.5.4",
    "langchain-openai>=1.5.1",
    # Imported directly by infrastructure/harness/checkpointing.py for the async
    # saver. It arrives transitively through langgraph-checkpoint-sqlite, and a
    # transitive dep is not a promise.
    "aiosqlite>=0.22.1",
    # Imported directly by infrastructure/definitions.py and
    # infrastructure/model_catalogue.py. It also arrives transitively through
    # deepagents, but a transitive dep is not a promise.
    #
    # It named `domain/frontmatter.py` until this commit, which has not existed
    # for two refactors -- and could not, since the domain is barred from
    # importing a third-party parser at all. A dependency justified by a file
    # that is gone is a dependency nobody can re-examine.
    "pyyaml>=6.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
# The HTTP surface, which is its own distribution rather than a directory in
# this one. An extra separates *dependencies*; only a second wheel separates
# code, and the requirement here was that a base install carry no web service at
# all -- not merely an inert copy of one with fastapi left uninstalled.
#
# So this names the package instead of its dependencies. `kingfisher-service`
# depends back on `kingfisher`, which is a cycle between distributions and
# resolves fine: verified with a throwaway pair before this was written, since
# "pip probably handles it" is not a thing to find out in a release.
service = ["kingfisher-service"]

# The definitions -- one working tool, skill and subagent. Separate for the same
# reason and by the same mechanism: `pip install kingfisher` should carry no
# example content, and an extra that named files rather than a package could not
# promise that. `kingfisher seed` finds whatever packs are installed, so this is
# the difference between a seeded workspace having examples in it and not.
assets = ["kingfisher-assets"]

[project.scripts]
# No `kingfisher-service` here, deliberately. The service ships its own command
# of that name, and two distributions declaring one script is not an override --
# it is a file both own. Measured: installing the service replaces the base's
# copy, *reinstalling the base replaces it back*, and uninstalling the service
# deletes the command outright. So an upgrade would silently swap a working
# server for a note telling you to install what you already have.
#
# The pointer lives on `kingfisher serve` instead, which collides with nothing
# and is in `--help` whether or not the service is installed.

# Seeding a workspace and looking at one, which are the two things the
# library cannot do for itself: running a task is `kingfisher.run`, and
# serving one is the script above. Deliberately not a general CLI --
# `main.py` stays the development driver, keeps its flags, and keeps a bare
# invocation that runs the eval smoke, which is a fine default for a driver
# and a wrong one for a stranger's first command.
kingfisher = "kingfisher.cli.__main__:main"

# No `[project.entry-points."kingfisher.assets"]` here, on purpose. It was here
# for one phase, so the discovery mechanism could be proved before any file
# moved; the definitions are their own distribution now and register themselves.
# A framework that announced itself as a source of content would be the thing
# this arrangement exists to stop.

[tool.hatch.build.targets.wheel]
packages = ["src/kingfisher"]

# Two distributions in one repository: the framework here, the definitions in
# `assets/`. Separate wheels, so `pip install kingfisher` carries no content --
# together in one checkout, so a change to a format and the examples of it can
# land in a single commit and be tested against each other.
