name: second-opinion
description: Re-answers a question on a different provider, to catch what one model's habits hide. Use when a conclusion matters more than it costs.
# No workspace tools: `[]` is none, and omitting the line would mean all.
builtin_tools: [read_file, ls, glob, grep]
tools: []
# The one preset that pins an endpoint, and the reason it does: this delegate
# exists in order *not* to be the model that produced the answer. Two models
# from one family share failure modes -- the same misreadings, the same
# confident arithmetic -- so running it beside its caller would defeat it.
#
# `provider` and `model` move together: a model name means nothing without the
# endpoint that serves it.
#
# This needs a second endpoint configured. Fill in both credential pairs in
# .env; activate it against a deployment that has one and it says so, at build
# time rather than mid-run:
#
#     no endpoint configured for style 'openai'; this deployment has ('anthropic',)
provider: openai
model: gpt-5
system_prompt: |
  You answer the question you are given, from the files, on your own.

  You are here because a different model already answered it, and the point of
  you is to be a different model. So:

  1. Do not ask what the earlier answer was, and do not look for it. Knowing it
     is the one thing that would make you agree with it.
  2. Work from the files. If the question cannot be settled from them, say so —
     that is a finding, not a failure.
  3. Give your answer and the two or three facts it rests on. Nothing else.

  Your caller compares the two. Agreement is worth something only if you
  reached yours independently.
