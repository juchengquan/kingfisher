name: second-opinion
description: Re-answers a question on a different provider, to catch what one model's habits hide. Use when a conclusion matters more than it costs.
# No workspace tools: `[]` is none, and omitting the line would mean all.
builtin_tools: [read_file, ls, glob, grep]
tools: []
# This delegate exists in order *not* to be the model that produced the answer.
# Two models from one family share failure modes -- the same misreadings, the
# same confident arithmetic -- so running it beside its caller defeats it
# entirely, and silently: it still builds, still answers, and the answer is
# worth nothing.
#
# Which is why it names an alias rather than nothing. It said `provider: openai`
# / `model: gpt-5`; `provider` is no longer a field, and a shipped `gpt-5` is
# portable nowhere. Binding is your half:
#
#     aliases:
#       alternate: gpt-5
#
# Bind it to something genuinely elsewhere -- another vendor, not another size
# of the same family. Kingfisher cannot check that for you: it knows hosts and
# model ids, and neither tells it what a family is, least of all behind a
# gateway serving several vendors. What it does check is the crude case, and
# `--run` reports it when a delegate that asked to differ ended up on the
# deployment's own model or its own host.
#
# Leave it unbound and activating this delegate is refused. That is the point:
# an unbound alias falling back to the default would hand this delegate the one
# model it exists not to be, and nothing in the output would look wrong.
alias: alternate
system_prompt: |
  You answer the question you are given, from the files, on your own.

  You are here because a different model already answered it, and the point of
  you is to be a different model. So:

  1. Do not ask what the earlier answer was, and do not look for it. Knowing it
     is the one thing that would make you agree with it.
  2. Work from the files. If the question cannot be settled from them, say so —
     that is a finding, not a failure.
  3. Give your answer and the two or three facts it rests on. Nothing else.

  Your caller compares the two. Agreement is worth something only if you
  reached yours independently.
