[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kingfisher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name="juchengquan"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "deepagents>=0.7.6",
    # Imported directly by infrastructure/agent.py, lazily, so that installing it
    # costs nothing until `KINGFISHER_INTERPRETER` is on. It also arrives through
    # deepagents' own `quickjs` extra, but an extra is not a promise either -- if
    # upstream renames it, uv warns and moves on while our import breaks. The
    # floor is deepagents' (`>=0.3.3` at 0.7.6) rather than the one the docs page
    # advertises, which is two minors behind what the library actually needs.
    # Verified rather than copied: the interpreter tests pass against 0.3.3 in a
    # venv pinned to it.
    #
    # Ceilinged because it is beta and says so at every construction. Under 0.x
    # the minor is where breaks land, and this one has moved through 0.1, 0.2 and
    # 0.3 in under two months -- deepagents raising its own floor to 0.3.3 is that
    # churn showing. `<0.4` takes the patches and stops at the next minor.
    #
    # If deepagents later needs `>=0.4`, uv fails to resolve rather than
    # installing something untested. That is the intended outcome: a build that
    # stops is a decision to make, where a silent upgrade is one already made.
    "langchain-quickjs>=0.3.3,<0.4",
    # Imported directly by adapters/models.py. It also arrives transitively
    # through deepagents, but a transitive dep is not a promise.
    "langchain-anthropic>=1.5.4",
    "langchain-openai>=1.5.1",
    # Imported directly by adapters/checkpointing.py for the async saver. It
    # arrives transitively through langgraph-checkpoint-sqlite, and a
    # transitive dep is not a promise.
    "aiosqlite>=0.22.1",
    # Imported directly by domain/frontmatter.py, which reads the same YAML
    # header deepagents reads. It also arrives transitively through deepagents,
    # but a transitive dep is not a promise.
    "pyyaml>=6.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
# The HTTP surface. Optional because a library caller pays nothing for a server
# they do not run, and separable because `kingfisher.server` is a consumer of
# the public API rather than part of it -- it may import `kingfisher` and
# nothing deeper, and no layer may import it back. `test_architecture.py` holds
# that line; this extra is what makes it a distribution boundary too.
server = [
    # For inbound validation and the generated schema. Responses are built by
    # hand from the dataclasses rather than mirrored as pydantic models:
    # `RunResult` keeps `run_dir` and `log_path` as `Path` so `json.dumps`
    # raises on them, and a mirror is a second home for that rule -- one where
    # adding a `Path` serialiser makes the error go away and ships exactly the
    # leak the original refuses.
    #
    # pydantic is not new weight: it already arrives through langchain. Starlette
    # arrives through fastapi and is imported directly for `Response`, but is not
    # named here -- fastapi's own floor is what decides which one is installed,
    # and a second floor would only fight it.
    "fastapi>=0.141.1",
    # Imported by nothing in the package; it is how the app gets served. Named
    # so `kingfisher[server]` installs something runnable rather than something
    # that needs a second install nobody wrote down.
    "uvicorn>=0.40.0",
]

[project.scripts]
# Present whether or not the extra is installed -- a script that exists and says
# "install the extra" is a better answer than one that is silently absent.
kingfisher-server = "kingfisher.server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kingfisher"]

[dependency-groups]
dev = [
    # The server extra, so its tests always run rather than skipping quietly on
    # a machine that happens not to have it. uvicorn is here for the same
    # reason: the entry point is only testable if it can be imported.
    "fastapi>=0.141.1",
    "uvicorn>=0.40.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Chosen to match what the code was already written against: the `noqa`
# directives predating this config name ANN001, ANN003, ARG002, BLE001 and
# S603, none of which are on by default, so lint results depended on whoever
# ran it. `D` is deliberately absent -- the docstrings here are written to be
# read, and pydocstyle would have them rewritten to suit a checker.
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "C4",        # comprehensions
    "RUF",       # ruff-specific
    "ANN",       # annotations
    "ARG",       # unused arguments
    "BLE",       # blind except
    "S",         # bandit
    "PTH",       # pathlib over os.path
    "RET",       # return consistency
    "TID",       # tidy imports
    "PL",        # pylint
    "DTZ",       # naive datetimes
    "EM",        # exception message literals
    "TRY",       # exception antipatterns
    "N",         # naming
    "T20",       # stray print
]
# `Any` is load-bearing at the library seams -- deepagents and LangGraph hand
# back shapes that are genuinely untyped, and pretending otherwise would mean
# inventing protocols that do not match.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# A driver whose whole job is printing, with the branchiness that implies --
# and one exit code per way a run can end, which is the clearer shape here.
"main.py" = ["T201", "PLR0911", "PLR0912", "PLR0915"]
# The long lines are inside string literals: the task's JSON schema commentary
# has to stay on one line to read as one field.
"evals/task.py" = ["E501"]
# Tests assert, take untyped fixtures, import locally to keep a case readable,
# and compare against literals -- that is what a test is. `RUF012` fires on a
# pydantic field, where a mutable default is handled by the model.
"tests/**" = [
    "S101", "ANN", "ARG", "PLC0415", "PLR2004", "S108", "S607", "RUF012",
]
# Not a test: a report you run by hand, so printing is its entire output. It
# lives beside the tests because the AST tooling does -- `test_architecture`
# reads the same trees -- and pytest does not collect it.
"tests/audit_duplication.py" = ["T201"]
# Throwaway probes, kept as a record of what was verified against the live
# gateway rather than as maintained code.
"spikes/**" = ["T201", "ANN", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["kingfisher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ty.environment]
python-version = "3.12"
# Point at the project venv so third-party types (deepagents, langchain,
# langgraph) are resolved. Without it ty sees only the standard library and
# reports every library attribute as unresolved.
python = ".venv"

[tool.ty.src]
include = ["src", "tests", "main.py", "spikes"]

[tool.ty.terminal]
output-format = "concise"
# Warnings are findings we have not triaged yet, so they fail the run rather
# than scrolling past. Anything genuinely not worth fixing gets an explicit
# rule setting below, where the decision is visible and reviewable.
error-on-warning = true

# `spikes/` are throwaway probes kept as a record of what was verified against
# the live gateway. They are not maintained, and holding them to the same bar
# as shipped code would mean editing history to satisfy a checker.
[[tool.ty.overrides]]
include = ["spikes/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

# Tests exercise seams a type checker cannot see through: fakes that stand in
# for protocol implementations, monkeypatched module attributes, and stubs whose
# fields are populated by the code under test. These three rules fire on that
# and nothing else here, so they are scoped off for tests rather than silenced
# globally -- the same rules still guard `src/`.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
not-subscriptable = "ignore"
invalid-assignment = "ignore"
