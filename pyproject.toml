# The workspace, and the settings every package in it shares. No `[project]`
# here on purpose: this directory is not a distribution, it is where three of
# them live. `packages/kingfisher` is the library, and the other two extend it.
#
# uv calls this a virtual root. It means `uv sync` installs all three, one
# command lints and tests all three, and none of them can quietly grow its own
# idea of what the line length is.

[tool.uv.workspace]
members = ["packages/kingfisher", "packages/service", "packages/assets"]

# Development only. Nothing in `[project.dependencies]` names the pack: the
# arrow points assets -> framework and never back.
[tool.uv.sources]
kingfisher-assets = { workspace = true }
kingfisher-service = { workspace = true }

[dependency-groups]
dev = [
    # Installed for development so the pack's own tests run and the seeding
    # tests have a real pack to discover. Not a dependency of the framework --
    # this group is not part of any wheel.
    "kingfisher-assets",
    # The server extra, so its tests always run rather than skipping quietly on
    # a machine that happens not to have it. uvicorn is here for the same
    # reason: the entry point is only testable if it can be imported.
    "fastapi>=0.141.1",
    "uvicorn>=0.40.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Chosen to match what the code was already written against: the `noqa`
# directives predating this config name ANN001, ANN003, ARG002, BLE001 and
# S603, none of which are on by default, so lint results depended on whoever
# ran it. `D` is deliberately absent -- the docstrings here are written to be
# read, and pydocstyle would have them rewritten to suit a checker.
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "C4",        # comprehensions
    "RUF",       # ruff-specific
    "ANN",       # annotations
    "ARG",       # unused arguments
    "BLE",       # blind except
    "S",         # bandit
    "PTH",       # pathlib over os.path
    "RET",       # return consistency
    "TID",       # tidy imports
    "PL",        # pylint
    "DTZ",       # naive datetimes
    "EM",        # exception message literals
    "TRY",       # exception antipatterns
    "N",         # naming
    "T20",       # stray print
]
# `Any` is load-bearing at the library seams -- deepagents and LangGraph hand
# back shapes that are genuinely untyped, and pretending otherwise would mean
# inventing protocols that do not match.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# A driver whose whole job is printing, with the branchiness that implies --
# and one exit code per way a run can end, which is the clearer shape here.
"main.py" = ["T201", "PLR0911", "PLR0912", "PLR0915"]
# The shipped command, for the first of those reasons only: it prints what the
# library returned and decides nothing, so it is short and flat. `T201` is the
# whole exemption -- if this ever needs the other three it has stopped being a
# thin driver and that is worth noticing.
"packages/kingfisher/src/kingfisher/cli/**" = ["T201"]
# The long lines are inside string literals: the task's JSON schema commentary
# has to stay on one line to read as one field.
"evals/task.py" = ["E501"]
# Tests assert, take untyped fixtures, import locally to keep a case readable,
# and compare against literals -- that is what a test is. `RUF012` fires on a
# pydantic field, where a mutable default is handled by the model.
#
# Both test trees, because both are tests: `assets/tests` belongs to the other
# distribution in this workspace, and holding it to a different bar than the one
# beside it would only mean two conventions for the same kind of file.
"packages/kingfisher/tests/**" = [
    "S101", "ANN", "ARG", "PLC0415", "PLR2004", "S108", "S607", "RUF012",
]
"packages/service/tests/**" = [
    "S101", "ANN", "ARG", "PLC0415", "PLR2004", "S108", "S607", "RUF012",
]
"packages/assets/tests/**" = [
    "S101", "ANN", "ARG", "PLC0415", "PLR2004", "S108", "S607", "RUF012",
]
# Not a test: a report you run by hand, so printing is its entire output. It
# lives beside the tests because the AST tooling does -- `test_architecture`
# reads the same trees -- and pytest does not collect it.
"packages/kingfisher/tests/audit_duplication.py" = ["T201"]
# Throwaway probes, kept as a record of what was verified against the live
# gateway rather than as maintained code.
"spikes/**" = ["T201", "ANN", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["kingfisher"]

[tool.pytest.ini_options]
# Both distributions in this workspace. The pack's tests are about its content
# and kingfisher's are about the framework, but one command has to run both or a
# preset breaks with nothing red.
testpaths = ["packages/kingfisher/tests", "packages/assets/tests", "packages/service/tests"]
# The repository root, so `main.py` is importable, and the library's own
# test directory, so the other two packages can reach the fixtures that
# describe a workspace -- `packages/service/tests/conftest.py` says why.
pythonpath = [".", "packages/kingfisher"]

[tool.ty.environment]
python-version = "3.12"
# Point at the project venv so third-party types (deepagents, langchain,
# langgraph) are resolved. Without it ty sees only the standard library and
# reports every library attribute as unresolved.
python = ".venv"

[tool.ty.src]
include = ["packages/kingfisher/src", "packages/kingfisher/tests", "main.py", "spikes"]

[tool.ty.terminal]
output-format = "concise"
# Warnings are findings we have not triaged yet, so they fail the run rather
# than scrolling past. Anything genuinely not worth fixing gets an explicit
# rule setting below, where the decision is visible and reviewable.
error-on-warning = true

# `spikes/` are throwaway probes kept as a record of what was verified against
# the live gateway. They are not maintained, and holding them to the same bar
# as shipped code would mean editing history to satisfy a checker.
[[tool.ty.overrides]]
include = ["spikes/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

# Tests exercise seams a type checker cannot see through: fakes that stand in
# for protocol implementations, monkeypatched module attributes, and stubs whose
# fields are populated by the code under test. These three rules fire on that
# and nothing else here, so they are scoped off for tests rather than silenced
# globally -- the same rules still guard `src/`.
[[tool.ty.overrides]]
include = ["packages/*/tests/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
not-subscriptable = "ignore"
invalid-assignment = "ignore"
