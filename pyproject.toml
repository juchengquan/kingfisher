[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kingfisher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name="juchengquan"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "deepagents>=0.7.6",
    # Imported directly by infrastructure/harness/agent.py, lazily, so that installing it
    # costs nothing until `KINGFISHER_INTERPRETER` is on. It also arrives through
    # deepagents' own `quickjs` extra, but an extra is not a promise either -- if
    # upstream renames it, uv warns and moves on while our import breaks. The
    # floor is deepagents' (`>=0.3.3` at 0.7.6) rather than the one the docs page
    # advertises, which is two minors behind what the library actually needs.
    # Verified rather than copied: the interpreter tests pass against 0.3.3 in a
    # venv pinned to it.
    #
    # Ceilinged because it is beta and says so at every construction. Under 0.x
    # the minor is where breaks land, and this one has moved through 0.1, 0.2 and
    # 0.3 in under two months -- deepagents raising its own floor to 0.3.3 is that
    # churn showing. `<0.4` takes the patches and stops at the next minor.
    #
    # If deepagents later needs `>=0.4`, uv fails to resolve rather than
    # installing something untested. That is the intended outcome: a build that
    # stops is a decision to make, where a silent upgrade is one already made.
    "langchain-quickjs>=0.3.3,<0.4",
    # Imported directly by infrastructure/harness/models.py. It also arrives
    # transitively through deepagents, but a transitive dep is not a promise.
    "langchain-anthropic>=1.5.4",
    "langchain-openai>=1.5.1",
    # Imported directly by infrastructure/harness/checkpointing.py for the async
    # saver. It arrives transitively through langgraph-checkpoint-sqlite, and a
    # transitive dep is not a promise.
    "aiosqlite>=0.22.1",
    # Imported directly by infrastructure/definitions.py and
    # infrastructure/model_catalogue.py. It also arrives transitively through
    # deepagents, but a transitive dep is not a promise.
    #
    # It named `domain/frontmatter.py` until this commit, which has not existed
    # for two refactors -- and could not, since the domain is barred from
    # importing a third-party parser at all. A dependency justified by a file
    # that is gone is a dependency nobody can re-examine.
    "pyyaml>=6.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
# The HTTP surface, which is its own distribution rather than a directory in
# this one. An extra separates *dependencies*; only a second wheel separates
# code, and the requirement here was that a base install carry no web service at
# all -- not merely an inert copy of one with fastapi left uninstalled.
#
# So this names the package instead of its dependencies. `kingfisher-service`
# depends back on `kingfisher`, which is a cycle between distributions and
# resolves fine: verified with a throwaway pair before this was written, since
# "pip probably handles it" is not a thing to find out in a release.
service = ["kingfisher-service"]

[project.scripts]
# No `kingfisher-service` here, deliberately. The service ships its own command
# of that name, and two distributions declaring one script is not an override --
# it is a file both own. Measured: installing the service replaces the base's
# copy, *reinstalling the base replaces it back*, and uninstalling the service
# deletes the command outright. So an upgrade would silently swap a working
# server for a note telling you to install what you already have.
#
# The pointer lives on `kingfisher serve` instead, which collides with nothing
# and is in `--help` whether or not the service is installed.

# Seeding a workspace and looking at one, which are the two things the
# library cannot do for itself: running a task is `kingfisher.run`, and
# serving one is the script above. Deliberately not a general CLI --
# `tests/integration/driver.py` stays the development driver, keeps its
# flags, and keeps a bare invocation that runs the eval smoke, which is a
# fine default for a driver and a wrong one for a stranger's first command.
kingfisher = "kingfisher.presentation.cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kingfisher"]

# Definitions do not ride along. They lived at `src/kingfisher/assets` so that
# `pip install kingfisher` followed by `kingfisher seed` wrote a workspace that
# already worked; they are content, and where a deployment gets its content is a
# setting now -- `KINGFISHER_ASSETS`. This repository keeps a worked set in
# `examples/`, outside this list and outside the wheel.
#
# What that costs is real and is written down rather than glossed: a fresh
# install seeds nothing, and since a request must name an agent, it cannot run
# until definitions arrive from somewhere. See
# docs/design/2026-08-19-examples-are-ours-assets-are-yours.md.

[tool.uv.workspace]
members = ["service"]

[tool.uv.sources]
kingfisher-service = { workspace = true }

[dependency-groups]
dev = [
    # The server extra, so its tests always run rather than skipping quietly on
    # a machine that happens not to have it. uvicorn is here for the same
    # reason: the entry point is only testable if it can be imported.
    "fastapi>=0.141.1",
    "uvicorn>=0.40.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Chosen to match what the code was already written against: the `noqa`
# directives predating this config name ANN001, ANN003, ARG002, BLE001 and
# S603, none of which are on by default, so lint results depended on whoever
# ran it. `D` is deliberately absent -- the docstrings here are written to be
# read, and pydocstyle would have them rewritten to suit a checker.
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "C4",        # comprehensions
    "RUF",       # ruff-specific
    "ANN",       # annotations
    "ARG",       # unused arguments
    "BLE",       # blind except
    "S",         # bandit
    "PTH",       # pathlib over os.path
    "RET",       # return consistency
    "TID",       # tidy imports
    "PL",        # pylint
    "DTZ",       # naive datetimes
    "EM",        # exception message literals
    "TRY",       # exception antipatterns
    "N",         # naming
    "T20",       # stray print
]
# `Any` is load-bearing at the library seams -- deepagents and LangGraph hand
# back shapes that are genuinely untyped, and pretending otherwise would mean
# inventing protocols that do not match.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# A driver whose whole job is printing, with the branchiness that implies --
# and one exit code per way a run can end, which is the clearer shape here.
#
# Listed before `tests/**` below and therefore overridden by it, which is fine:
# the test ignores are a superset of these four. It stays spelled out because
# the reasons differ -- a test may print because it is a test, and this prints
# because printing is its output.
"tests/integration/driver.py" = ["T201", "PLR0911", "PLR0912", "PLR0915"]
# The shipped command, for the first of those reasons only: it prints what the
# library returned and decides nothing, so it is short and flat. `T201` is the
# whole exemption -- if this ever needs the other three it has stopped being a
# thin driver and that is worth noticing.
"src/kingfisher/presentation/cli/**" = ["T201"]
# The long lines are inside string literals: the task's JSON schema commentary
# has to stay on one line to read as one field.
"evals/task.py" = ["E501"]
# Tests assert, take untyped fixtures, import locally to keep a case readable,
# and compare against literals -- that is what a test is. `RUF012` fires on a
# pydantic field, where a mutable default is handled by the model.
#
# Both test trees, because both are tests: `service/tests` belongs to the other
# distribution in this workspace, and holding it to a different bar than the one
# beside it would only mean two conventions for the same kind of file.
"tests/**" = [
    "S101", "ANN", "ARG", "PLC0415", "PLR2004", "S108", "S607", "RUF012",
]
"service/tests/**" = [
    "S101", "ANN", "ARG", "PLC0415", "PLR2004", "S108", "S607", "RUF012",
]
# Not a test: a report you run by hand, so printing is its entire output. It
# lives beside the tests because the AST tooling does -- `test_architecture`
# reads the same trees -- and pytest does not collect it.
"tests/audit_duplication.py" = ["T201"]
# Throwaway probes, kept as a record of what was verified against the live
# gateway rather than as maintained code.
"spikes/**" = ["T201", "ANN", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["kingfisher"]

[tool.pytest.ini_options]
# Both distributions in this workspace. The pack's tests are about its content
# and kingfisher's are about the framework, but one command has to run both or a
# preset breaks with nothing red.
testpaths = ["tests", "service/tests"]
# The repository root, so `tests.integration.driver` and `evals` are importable,
# and the library's own test directory, so the other package can reach the
# fixtures that describe a workspace -- `service/tests/conftest.py` says why.
pythonpath = ["."]

[tool.ty.environment]
python-version = "3.12"
# Point at the project venv so third-party types (deepagents, langchain,
# langgraph) are resolved. Without it ty sees only the standard library and
# reports every library attribute as unresolved.
python = ".venv"

[tool.ty.src]
# `examples` is here because it holds Python -- shipped-looking tools that an
# agent imports. Under `src/` it was checked by accident; at the root it would
# fall out of this list silently, which is the kind of check that stops running
# without ever going red.
include = ["src", "tests", "examples", "spikes"]

[tool.ty.terminal]
output-format = "concise"
# Warnings are findings we have not triaged yet, so they fail the run rather
# than scrolling past. Anything genuinely not worth fixing gets an explicit
# rule setting below, where the decision is visible and reviewable.
error-on-warning = true

# `spikes/` are throwaway probes kept as a record of what was verified against
# the live gateway. They are not maintained, and holding them to the same bar
# as shipped code would mean editing history to satisfy a checker.
[[tool.ty.overrides]]
include = ["spikes/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

# Tests exercise seams a type checker cannot see through: fakes that stand in
# for protocol implementations, monkeypatched module attributes, and stubs whose
# fields are populated by the code under test. These three rules fire on that
# and nothing else here, so they are scoped off for tests rather than silenced
# globally -- the same rules still guard `src/`.
[[tool.ty.overrides]]
include = ["tests/**", "service/tests/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
not-subscriptable = "ignore"
invalid-assignment = "ignore"
