name: assistant
description: General-purpose agent for a workspace with no particular specialism.
# No `builtin_tools:` and no `tools:`, which is how this format says *all of
# them* -- every tool deepagents brings, and every tool this workspace defines.
# Leaving them out is the one place omission grants rather than withholds, and
# the reason is that an agent can do nothing at all without tools.
#
# The other two fields work the other way: omit `skills` or `subagents` and you
# get none. So this file names them, and that asymmetry is the whole of the
# format's omission rule -- tools are what an agent needs to *act*, skills and
# delegates are what it needs to *know* and to *ask*.
skills: ["*"]
# The delegates that ship beside this file. Naming them is what makes them
# reachable: a request narrows what an agent declares and can never widen it,
# so a subagent no agent names is a definition nothing can call.
#
# It costs. Each one compiles its own graph, measured at about 4.3ms, on every
# turn whether or not the task needs it -- so drop a name you never use rather
# than keeping the list tidy for its own sake.
#
# A delegate that names helpers of its own brings them with it: grant the
# delegate and its helpers arrive, without the agent listing them here.
subagents: [extractor, reviewer, profiler]
# Every example middleware this repository ships, each by name. Named rather
# than `["*"]`: a star takes whatever the workspace offers, so on a seeded one it
# would also take anything added later for another agent, and a name says
# exactly what this agent runs under. The prompt below tells it the same.
#
# The price of a name is `seed`'s rule. `seed` cannot see what a deployment
# registered, so it leaves behind any definition naming middleware -- this one
# arrives with `kingfisher seed --all`, which copies the `middlewares/` these
# names resolve to in the same run.
#
# Both caps, which is `researcher`'s shape: the stricter decides, so a turn
# stops at twenty calls. `call-cap-generous` is here so a delegate may name it,
# since this line is what its delegates are clamped by. `tool-note` bare carries
# the deployment's own wording, where `researcher` and `sweeper` each write
# theirs; `compact` bare summarises on the model this agent already runs.
middlewares:
  - call-cap-strict
  - call-cap-generous
  - tool-note
  - compact
# No `model:` and no `alias:`, so this runs the `default:` in your models.yaml.
# That is the right answer for a general agent -- and for a file that ships
# inside a wheel, since no vendor's model id is portable anywhere else.
#
# No `memory:` either, which means "no opinion": memory is on if your
# deployment wired it and off if it did not.

# Required, and the third of the three fields that are: `name`, `description`,
# this. Every field above has an answer without being written -- a tool field
# left out inherits, `skills` left out grants none -- and this one does not.
# `system.md` describes the harness and `PROMPT.md` describes the workspace;
# neither has heard of this agent, so a file without a prompt is a list of tools
# with nothing anywhere saying what they are for.
#
# Written after `|`, a literal block, so the line breaks you wrote reach the
# model. A folded `>` or a plain scalar joins consecutive lines into one and is
# refused rather than quietly reflowed.
system_prompt: |
  You work in this workspace, on whatever the caller asks for.

  This text is *added* to the harness prompt that already told you about
  `/data`, `/skills` and your tools -- it does not replace it. Say the things
  that are true of this agent and nothing else; the rest is already said.

  Delegate the reading. `extractor` exists so that a hundred files can be
  turned into a short answer without a hundred files landing in your context,
  and `profiler` exists so nobody computes a figure from a column they have not
  looked at. Both run on a cheaper model than you do.

  You work under a budget. A middleware caps how many tool calls you may make
  in one turn; when it runs out, the next call comes back as an error saying
  so, and you answer from what you have and say where you stopped. A delegate's
  calls are its own, so a hundred files read through `extractor` cost you one.

  In a long conversation the older part is summarised for you. What the summary
  replaced is kept under `/derived/compaction/`; read it when the summary is not
  enough.

  Check what you would report. `reviewer` recomputes a figure from the file
  rather than from your working, which is the only kind of check worth having.

  Say what you did not do. A report that implies it was exhaustive is worse
  than one that names its own edges.
