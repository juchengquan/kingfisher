# The source-id vocabulary: which names exist here, and which covers which.
#
# Copy this to `$KINGFISHER_WORKSPACE/source_ids.yaml`, or point
# `KINGFISHER_SOURCE_IDS_FILE` at it. It is the only central file source-id
# access has, and it is the one `seed` does not copy -- `seed` copies
# definitions, and this is not one. A deployment writing it is deciding
# something about itself.
#
# **With no such file, kingfisher controls nothing by source id.** Every
# definition is reachable by everyone, a `source_ids:` line anywhere is inert,
# and everything behaves as it did before any of this existed. That is the
# default on purpose: adopting access control should be a thing you do, not a
# thing you inherit.
#
# **This file holds no policy.** Who reaches what is written in the definitions
# themselves -- see `agents/analyst.yaml` and `subagents/auditor.yaml` beside
# it. What lives here is the two things a definition cannot say for itself:
#
#   - that a name is *real*, so `source_ids: [sales_bd]` is refused at startup
#     rather than inventing a source id nobody holds and quietly hiding an agent
#   - that one name stands for several, so a broad source id is written once here
#     rather than on every line of every definition, forever
#
# A name's body says which of those two it does, by its shape and not by a
# keyword: **a list is what the name covers, a set is what it requires.**

source_ids:
  # The short form. A source id that covers nothing needs no body, and most do
  # not -- `sales_db:` and a bare `- sales_db` mean the same thing, so a flat
  # vocabulary can be written as a plain list:
  #
  #     source_ids: [sales_db, audit_log, crm]
  #
  # Spelled long here only because `warehouse` below needs a body, and one file
  # switching form halfway is harder to read than one that does not.
  sales_db:
  audit_log:

  # Written out, and worth reading twice: this is the whole reason the
  # vocabulary is central rather than inferred from what the definitions
  # mention.
  #
  # `warehouse` appears on no definition in this set. It does not need to --
  # covering the other two means somebody holding `warehouse` reaches anything
  # either of them reaches, including definitions added next year that have
  # never heard of it.
  #
  # Without this, a broad source id is typed onto every audience in every file,
  # and forgotten on exactly one of them. The one it is forgotten on is the one
  # nobody notices, because the symptom is a caller who cannot reach a thing
  # they were never told they could.
  warehouse: [sales_db, audit_log]

  # A classification, held alongside one of the sources above rather than
  # instead of one. On its own it reaches nothing here, and that is deliberate:
  # it says what a caller may see of a source, not which source.
  pii:

  # The other operation this file can express, and the opposite of the list
  # above. The braces are the whole difference.
  #
  # A list says what holding a name *grants*. A set says what a caller must
  # hold for a name to *apply*: `sales_db_pii` is not something anybody is
  # given -- it is what holding `sales_db` and `pii` together adds up to.
  #
  # Which is why a caller may not present it. `--as sales_db_pii` is refused
  # naming the parts, because accepting it would let one claim stand in for the
  # two that the requirement exists to demand. Send `sales_db` and `pii`;
  # this name derives itself.
  #
  # A name is a list or a set and cannot be both, so the question of what a name
  # that grants and costs at once would mean never arises -- the shape settles
  # it where a pair of keywords had to be refused.
  #
  # A `warehouse` who also holds `pii` reaches this, without ever holding
  # `sales_db` itself -- covering a source is not the same as being classified
  # for it, but expansion runs first and the requirement is checked against what
  # is held afterwards. A `warehouse` alone does not: nothing here hands out
  # `pii`.
  sales_db_pii: {sales_db, pii}

# Expansion is transitive and cycles are refused, naming the whole loop rather
# than one edge of it -- one edge does not tell a reader which link to cut, and
# whoever reads the message may hold none of the source ids in it.
#
# A set may not appear inside a list. `warehouse: [{sales_db, pii}, audit_log]`
# reads as legal and is the requirement defeated by the file that writes it, so
# it is refused where it is written rather than at the caller.
#
# There is no `agents:`, `subagents:` or `tools:` section here, and writing one
# is refused by name. There was, in the first version of this feature: one
# central table listing every asset and who reached it. It went because a table
# can name an asset the workspace no longer offers, and a definition cannot --
# it *is* the asset it is about. See `docs/decisions.md`, which records the
# reversal and why it is the useful half.
