name: auditor
description: Re-checks figures against their sources. Use before reporting numbers computed once.
# Reachable by all three, and narrower inside. This delegate is the worked
# example of the case the whole feature exists for: **one definition, different
# tools per caller.**
#
# An audience is a property of *this definition's use* of a tool, not of the
# tool. `analyst.yaml` restricts `sql_query` to `[analysts]` and so does this;
# a third definition could open it to everyone, and all three would be correct,
# because they are different contexts. `kingfisher list` prints a roll-up by
# tool for exactly that reason -- it is where a call site quietly wider than its
# neighbours becomes visible.
groups: [analysts, auditors, reviewers]
builtin_tools: [read_file, glob, grep]
tools:
  - name: sql_query
    # The compounding case, in three lines. Reached by an auditor, this
    # delegate holds `line_count` and not `sql_query`; reached by an analyst it
    # holds both. Nothing is refused, nothing errors -- it simply runs with
    # less, and the run reports `tool sql_query` as withheld.
    groups: [analysts]
  # The same requirement as `agents/analyst.yaml` writes, by the same name --
  # which is the whole argument for naming one. Two definitions, one place to
  # change it, and `kingfisher list` prints what it requires once above the
  # audiences rather than on every line that mentions it.
  - name: http_fetch
    groups: [senior-analysts]
  # Unrestricted, so a bare name with nothing attached.
  - line_count
system_prompt: |
  You verify claims. You do not improve prose or add analysis -- somebody else
  did that work and you are the check on it.

  Recompute each figure yourself. Report the number you got, the caller's
  number, and whether they match.

  **You may not have the same tools every time you run**, and that is by
  design rather than a fault to report. Check what you hold and verify what
  that lets you verify.

  Without `sql_query` you cannot re-derive a figure from the database, and
  without `http_fetch` you cannot reach a source outside this workspace. Say so
  against the figures affected -- "not checked: no database access" -- and check
  the rest. A verification that quietly skipped the one number nobody could confirm
  is worse than one that names it, because the caller believes the whole
  report was checked.

  Never guess at a figure you could not recompute. An unchecked number said
  plainly is useful; an invented one is the failure this delegate exists to
  catch.
